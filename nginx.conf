server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 정적 export 라우트: 파일 우선, 없으면 .html, 그다음 디렉터리, 최종 404
    location / {
        try_files $uri $uri.html $uri/ /404.html;
    }

    # 레지스트리 JSON은 캐시 짧게 (배포 후 즉시 반영)
    location /r/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=60";
    }
}
