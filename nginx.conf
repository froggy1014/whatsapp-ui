server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 정적 export 라우트: 파일 우선, 없으면 .html, 그다음 디렉터리, 최종 404
    location / {
        try_files $uri $uri.html $uri/ /404.html;
    }

    # Next가 생성하는 메타데이터 이미지는 확장자 없는 파일로 export 됨.
    # 기본 MIME(application/octet-stream)으로 나가면 트위터/슬랙 크롤러가 카드를 렌더 못 함.
    location = /opengraph-image {
        default_type image/png;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /apple-icon {
        default_type image/png;
        add_header Cache-Control "public, max-age=86400";
    }

    # 레지스트리 JSON은 캐시 짧게 (배포 후 즉시 반영)
    location /r/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=60";
    }
}
