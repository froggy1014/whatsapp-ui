name: deploy
on:
  push:
    branches: [main]
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/froggy1014/whatsapp-ui:${{ github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: froggy1014/froggy1014-k3s-infra
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          path: infra
      - name: Update image tag in infra repo
        run: |
          cd infra
          sed -i "s|image: ghcr.io/froggy1014/whatsapp-ui:.*|image: ghcr.io/froggy1014/whatsapp-ui:${{ github.sha }}|" \
            k3s/manifests/whatsapp-ui/deployment.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet && echo "no change" && exit 0
          git commit -am "chore: update whatsapp-ui image to ${{ github.sha }}"
          git push
